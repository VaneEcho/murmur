<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 — Murmur</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 12px; }
  h1 { font-size: 1.4rem; font-weight: 600; color: #1a1a1a; margin-bottom: 16px; }
  .card { background: white; border-radius: 16px; padding: 20px; width: 100%; max-width: 520px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .section-title { font-size: 0.8rem; font-weight: 600; color: #999; margin: 20px 0 12px; }
  .section-title:first-child { margin-top: 0; }
  label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 5px; }
  input[type="text"], input[type="url"], input[type="password"] {
    width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 10px;
    font-size: 16px; margin-bottom: 14px; outline: none;
  }
  input:focus { border-color: #4f8ef7; }
  .secret-field { position: relative; margin-bottom: 14px; }
  .secret-field input { margin-bottom: 0; padding-right: 80px; }
  .secret-field .set-badge { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; color: #aaa; pointer-events: none; }
  textarea { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 14px; resize: vertical; min-height: 180px; outline: none; line-height: 1.6; font-family: monospace; margin-bottom: 14px; }
  textarea:focus { border-color: #4f8ef7; }
  .hint { font-size: 0.78rem; color: #aaa; margin: -10px 0 14px; }
  button { width: 100%; padding: 14px; background: #4f8ef7; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:hover { background: #3a7ae0; }
  button.minor { background: white; color: #4f8ef7; border: 1px dashed #9bbdf5; font-size: 0.88rem; padding: 10px; margin-bottom: 14px; font-weight: 500; }
  button.minor:hover { background: #f2f7ff; }
  button:disabled { opacity: 0.6; cursor: default; }
  .toast { margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: #edf7f0; color: #2e7d52; font-size: 0.9rem; display: {% if saved %}block{% else %}none{% endif %}; }
  .nav { width: 100%; max-width: 520px; text-align: left; margin-bottom: 12px; }
  .nav a { color: #888; font-size: 0.85rem; text-decoration: none; }
  /* 词表 chip 样式 */
  .glossary-box { border: 1px solid #e0e0e0; border-radius: 10px; padding: 10px; margin-bottom: 10px; min-height: 48px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: #eef4ff; color: #3a6fd0; border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; }
  .chip span { cursor: pointer; outline: none; }
  .chip span:focus { text-decoration: underline; }
  .chip .x { cursor: pointer; color: #9bbdf5; font-size: 0.8rem; padding: 0 2px; line-height: 1; }
  .chip .x:hover { color: #c0392b; }
  .glossary-add { display: flex; gap: 8px; }
  .glossary-add input { flex: 1; margin-bottom: 0; }
  .glossary-add button { width: auto; padding: 10px 16px; font-size: 0.9rem; font-weight: 500; }
  .glossary-saved { font-size: 0.78rem; color: #2e7d52; margin-top: 6px; min-height: 1.2em; }
</style>
</head>
<body>
<h1>设置</h1>
<div class="nav"><a href="/">← 返回</a></div>
<div class="card">
  <form method="post" action="/settings">
    <div class="section-title">MEMOS</div>
    <label>地址</label>
    <input type="url" name="memos_url" value="{{ cfg.memos_url }}">
    <label>Token</label>
    <div class="secret-field">
      <input type="password" name="memos_token" placeholder="留空则保持不变">
      {% if cfg.memos_token %}<span class="set-badge">已设置</span>{% endif %}
    </div>

    <div class="section-title">模型</div>
    <label>API 地址</label>
    <input type="url" name="llm_url" id="llm_url" value="{{ cfg.llm_url }}" placeholder="https://api.deepseek.com/v1">
    <label>API Key</label>
    <div class="secret-field">
      <input type="password" name="llm_api_key" id="llm_api_key" placeholder="留空则保持不变">
      {% if cfg.llm_api_key %}<span class="set-badge">已设置</span>{% endif %}
    </div>
    <button type="button" class="minor" id="models-btn" onclick="fetchModels()">拉取模型</button>
    <label>模型</label>
    <select name="llm_model" id="llm_model" style="width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:10px;font-size:16px;margin-bottom:14px;background:white;">
      {% if cfg.llm_model %}<option value="{{ cfg.llm_model }}">{{ cfg.llm_model }}</option>{% endif %}
    </select>
    <label>整理模型（可选）</label>
    <select name="organize_model" id="organize_model" style="width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:10px;font-size:16px;margin-bottom:14px;background:white;">
      <option value="">（同上）</option>
      {% if cfg.organize_model %}<option value="{{ cfg.organize_model }}" selected>{{ cfg.organize_model }}</option>{% endif %}
    </select>

    <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;">
      <input type="checkbox" name="llm_think" value="1" {% if cfg.llm_think == '1' %}checked{% endif %} style="width:18px;height:18px;">
      思考模式
    </label>

    <div class="section-title">日记</div>
    <label>标签</label>
    <input type="text" name="diary_tag" value="{{ cfg.diary_tag }}">

    <div class="section-title">词表</div>
    <div class="glossary-box" id="glossary-chips"></div>
    <div class="glossary-add">
      <input type="text" id="glossary-input" placeholder="添加词条" onkeydown="if(event.key==='Enter'){event.preventDefault();addTerm();}">
      <button type="button" onclick="addTerm()">添加</button>
    </div>
    <div class="glossary-saved" id="glossary-saved"></div>

    <div class="section-title">提示词</div>
    <p class="hint">变量：{content} {date}</p>
    <textarea name="prompt">{{ cfg.prompt }}</textarea>

    <button type="submit">保存</button>
    <div class="toast">已保存</div>
  </form>
</div>
<script>
// 词表数据
let terms = {{ cfg.glossary | tojson }}.split('\n').map(s => s.trim()).filter(Boolean);

function renderChips() {
  const box = document.getElementById('glossary-chips');
  box.innerHTML = terms.map((t, i) =>
    `<span class="chip">
      <span contenteditable="true" onblur="editTerm(${i}, this.textContent.trim())" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${escHtml(t)}</span>
      <span class="x" onclick="removeTerm(${i})">✕</span>
    </span>`
  ).join('');
}

function escHtml(s) { const el = document.createElement('span'); el.textContent = s; return el.innerHTML; }

function removeTerm(i) {
  terms.splice(i, 1);
  renderChips();
  saveGlossary();
}

function editTerm(i, val) {
  if (!val) { removeTerm(i); return; }
  terms[i] = val;
  saveGlossary();
}

function addTerm() {
  const inp = document.getElementById('glossary-input');
  const val = inp.value.trim();
  if (!val) return;
  if (!terms.includes(val)) {
    terms.push(val);
    renderChips();
    saveGlossary();
  }
  inp.value = '';
}

let saveTimer = null;
async function saveGlossary() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const msg = document.getElementById('glossary-saved');
    try {
      await fetch('/api/glossary', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ terms }),
      });
      msg.textContent = '已保存';
      setTimeout(() => { msg.textContent = ''; }, 2000);
    } catch(e) { msg.textContent = '保存失败'; }
  }, 400);
}

renderChips();

async function fetchModels() {
  const btn = document.getElementById('models-btn');
  btn.disabled = true; btn.textContent = '拉取中';
  try {
    const resp = await fetch('/api/models', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        llm_url: document.getElementById('llm_url').value,
        llm_api_key: document.getElementById('llm_api_key').value,
      }),
    });
    const data = await resp.json();
    if (!data.ok) { alert(data.error); }
    else {
      const current1 = document.getElementById('llm_model').value;
      const current2 = document.getElementById('organize_model').value;
      const opts = data.models.map(m => `<option value="${m}"${m===current1?' selected':''}>${m}</option>`).join('');
      const opts2 = '<option value="">（同上）</option>' + data.models.map(m => `<option value="${m}"${m===current2?' selected':''}>${m}</option>`).join('');
      document.getElementById('llm_model').innerHTML = opts;
      document.getElementById('organize_model').innerHTML = opts2;
      btn.textContent = `已拉取 ${data.models.length} 个`;
      btn.disabled = false;
      return;
    }
  } catch (e) { alert(e.message); }
  btn.disabled = false; btn.textContent = '拉取模型';
}
</script>
</body>
</html>
